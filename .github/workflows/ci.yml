name: CI Nuxt

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Installer les dependances
        run: npm ci

      - name: verifier le code avec Eslint
        run: npm run lint

      - name: verifier le formatage avec prettier
        run: npm run format:check
      - name: Vérifier les types TypeScript
        run: npm run typecheck

      - name: vérifier le build nuxt (contruction du projet)
        run: npm run build
