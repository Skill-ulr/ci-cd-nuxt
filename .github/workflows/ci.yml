name: CI Nuxt

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # FRONTEND NUXT
      - name: Installer les dependances
        run: npm ci

      - name: Verifier le code avec ESLint
        run: npm run lint

      - name: Verifier le formatage avec Prettier
        run: npm run format:check

      - name: Verifier les types TypeScript
        run: npm run typecheck

      - name: Verifier le build Nuxt
        run: npm run build

      # BACKEND HONO
      - name: Installer les dependances du backend
        run: npm ci
        working-directory: backend

      - name: Verifier le code backend avec ESLint
        run: npm run lint
        working-directory: backend

      - name: Verifier le formatage backend avec Prettier
        run: npm run format:check
        working-directory: backend

      - name: Verifier les types TypeScript du backend
        run: npm run typecheck
        working-directory: backend

      - name: Build du backend Hono
        run: npm run build
        working-directory: backend

      - name: Tests backend Hono
        run: npm run test
        working-directory: backend

      # E2E : test du parcours complet dans un vrai navigateur
      - name: Installer le navigateur Playwright
        run: npx playwright install --with-deps chromium

      - name: Tests E2E Playwright
        run: npm run test:e2e